name: Deploy Theme to DigitalOcean VPS

on:
  push:
    branches:
      - main  # Tự động chạy mỗi khi push vào nhánh main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: Đồng bộ code qua VPS bằng Rsync (SSH)
        uses: easingthemes/ssh-deploy@v5.1.0  # Đã chuẩn hóa phiên bản ổn định (deploy)
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"
          ARGS: "-rlgoDzvO --delete"
          REMOTE_HOST: ${{ secrets.VPS_IP }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          TARGET: "/var/www/html/wp-content/themes/doanvienuutu"
          EXCLUDE: "/.git/, /.github/"

      - name: Khởi chạy lệnh phân quyền lại cho Web Server trên VPS
        uses: appleboy/ssh-action@v1.0.3  # Đã sửa từ @main thành @v1.0.3 chuẩn hóa
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo chown -R www-data:www-data /var/www/html/wp-content/themes/doanvienuutu
            sudo chmod -R 755 /var/www/html/wp-content/themes/doanvienuutu